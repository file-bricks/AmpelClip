[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ampelclip"
version = "1.2.0"
description = "Local-first Windows clipboard privacy monitor with traffic-light preview and anonymization support"
readme = "README.md"
authors = [
    { name = "file-bricks Team" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities"
]
keywords = [
    "clipboard",
    "privacy",
    "anonymization",
    "redaction",
    "pyside6",
    "windows",
    "offline-first",
    "local-first",
    "data-protection",
    "pii-redaction"
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "openpyxl>=3.1.0"
]

[project.urls]
Homepage = "https://github.com/file-bricks/AmpelClip#readme"
Documentation = "https://github.com/file-bricks/AmpelClip/blob/master/llms.txt"
Repository = "https://github.com/file-bricks/AmpelClip.git"
Issues = "https://github.com/file-bricks/AmpelClip/issues"
Changelog = "https://github.com/file-bricks/AmpelClip/blob/master/CHANGELOG.md"
Security = "https://github.com/file-bricks/AmpelClip/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/file-bricks/AmpelClip/blob/master/THIRD_PARTY_LICENSES.txt"
"Marketing Log" = "https://github.com/file-bricks/AmpelClip/blob/master/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/file-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/file-bricks/AmpelClip/blob/master/llms.txt"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
